name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew test verifyPluginProjectConfiguration buildPlugin

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: error

  compatibility:
    # Runs the IntelliJ Plugin Verifier against the recommended IDE builds.
    # Kept off pull requests: it downloads several IDEs and takes minutes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verification-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
